<section class="sge-ledger" aria-label="Resumo de vendas">
  <div class="sge-ledger-col">
    <span class="sge-ledger-label">Quantidade de vendas</span>
    <span class="sge-ledger-value">{{ sales_metrics.total_sales }}</span>
  </div>
  <div class="sge-ledger-col">
    <span class="sge-ledger-label">Produtos vendidos</span>
    <span class="sge-ledger-value">{{ sales_metrics.total_products_sold }}</span>
  </div>
  <div class="sge-ledger-col">
    <span class="sge-ledger-label">Valor das vendas</span>
    <span class="sge-ledger-value">R$ {{ sales_metrics.total_sales_value }}</span>
  </div>
  <div class="sge-ledger-col">
    <span class="sge-ledger-label">Lucro das vendas</span>
    <span class="sge-ledger-value is-in">R$ {{ sales_metrics.total_sales_profit }}</span>
  </div>
</section>
