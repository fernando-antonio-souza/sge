<section class="sge-ledger" aria-label="Resumo de estoque">
  <div class="sge-ledger-col">
    <span class="sge-ledger-label">Quantidade de produtos</span>
    <span class="sge-ledger-value">{{ product_metrics.total_quantity }}</span>
  </div>
  <div class="sge-ledger-col">
    <span class="sge-ledger-label">Custo de estoque</span>
    <span class="sge-ledger-value">R$ {{ product_metrics.total_cost_price }}</span>
  </div>
  <div class="sge-ledger-col">
    <span class="sge-ledger-label">Valor de estoque</span>
    <span class="sge-ledger-value">R$ {{ product_metrics.total_selling_price }}</span>
  </div>
  <div class="sge-ledger-col">
    <span class="sge-ledger-label">Lucro de estoque</span>
    <span class="sge-ledger-value is-in">R$ {{ product_metrics.total_profit }}</span>
  </div>
</section>
