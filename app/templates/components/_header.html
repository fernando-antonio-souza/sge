<header class="sge-topbar">
  <button class="btn btn-outline-secondary btn-sm d-md-none" type="button"
    data-bs-toggle="offcanvas" data-bs-target="#sgeSidebar" aria-controls="sgeSidebar" aria-label="Abrir menu">
    <i class="bi bi-list" aria-hidden="true"></i>
  </button>

  <span class="d-md-none fw-bold">SGE</span>

  <span class="sge-topbar-date" aria-label="Data de hoje">{% now 'd/m/Y' %}</span>

  <span class="sge-topbar-user">{{ user.username }}</span>
</header>
