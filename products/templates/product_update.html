{% extends 'base.html' %}

{% block content %}

<div>
    <h1 class="sge-page-title">Editar Produto</h1>

    <div class="card">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p}}
                <button type="submit" class="btn btn-primary">Salvar Produto</button>
            </form>
        </div>
    </div>
    <a href="{% url 'product_list' %}" class="btn btn-secondary mt-3">Cancelar e Voltar para a Lista de Produtos</a>
</div> 

{% endblock %}
