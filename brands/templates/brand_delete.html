{% extends 'base.html' %}

{% block content %}

<div>
    <h1 class="sge-page-title">Deletar Marca</h1>

    <div class="card">
        <div class="card-body">
            <p class="card-text">Tem certeza de que deseja excluir a marca <strong>{{ object.name }}?</strong></p>

            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Deletar</button>
            </form>

            <a href="{% url 'brand_list' %}" class="btn btn-secondary mt-3">Cancelar e Voltar para a Lista de Marcas</a>
        </div>

    </div>
</div>

{% endblock %}
